name: Top Mover aktualisieren

on:
  schedule:
    # Werktags 06:15 UTC - nach US-Schluss und eine halbe Stunde nach dem
    # Chancenraum, damit sich die beiden Laeufe nicht beim Push begegnen.
    - cron: "15 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mover
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kursbewegungen rechnen
        run: node scripts/build_mover.js

      - name: Aenderungen committen
        run: |
          git config user.name "mover-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mover.json
          git diff --cached --quiet && echo "Keine Aenderungen." && exit 0
          git commit -m "Top Mover aktualisiert ($(date -u +%F))"
          git pull --rebase --autostash || true
          git push
